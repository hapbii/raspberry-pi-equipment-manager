name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q equipment_manager scripts deploy tests wsgi.py serve.py
      - name: Check service installer syntax
        run: bash -n deploy/install_service.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check browser request lifecycle
        run: node --test tests/test_frontend.cjs

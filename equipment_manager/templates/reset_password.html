{% extends "base.html" %}
{% block title %}학생 비밀번호 재설정{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h1>학생 비밀번호 재설정</h1><p>{{ student.student_id }} · {{ student.name }}</p>
  <p>학생 본인을 확인한 경우에만 진행하세요. 기존 비밀번호는 확인할 수 없습니다. 새 비밀번호를 학생에게 직접 전달하고 본인이 다시 변경하도록 안내하세요.</p>
  <label for="reset-password">새 비밀번호 (12~128자)</label><input id="reset-password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
  <label for="reset-confirm">새 비밀번호 확인</label><input id="reset-confirm" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
  <button class="button primary large" type="submit">비밀번호 재설정 및 기존 로그인 종료</button>
</form></section>
{% endblock %}

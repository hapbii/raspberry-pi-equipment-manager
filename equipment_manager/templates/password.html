{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h1>비밀번호 변경</h1><p>변경하면 모든 기기에서 로그아웃됩니다.</p>
  <label for="old-password">현재 비밀번호</label><input id="old-password" name="old_password" type="password" maxlength="128" autocomplete="current-password" required>
  <label for="new-password">새 비밀번호 (12~128자)</label><input id="new-password" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
  <label for="confirm-password">새 비밀번호 확인</label><input id="confirm-password" name="password_confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
  <button class="button primary large" type="submit">비밀번호 변경</button>
</form></section>
{% endblock %}

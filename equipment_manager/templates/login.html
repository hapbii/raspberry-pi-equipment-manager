{% extends "base.html" %}
{% block title %}관리자 로그인{% endblock %}
{% block content %}
<section class="auth-wrap">
  <form class="auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="auth-icon" aria-hidden="true">A</div>
    <p class="eyebrow">ADMIN ACCESS</p>
    <h1>관리자 로그인</h1>
    <p>선생님 또는 개발자 관리자 계정으로 로그인하세요.</p>
    <label for="admin-username">관리자 아이디</label>
    <input id="admin-username" name="username" type="text" required autofocus autocomplete="username" placeholder="관리자 아이디 입력">
    <label for="admin-password">관리자 비밀번호</label>
    <input id="admin-password" name="password" type="password" required autocomplete="current-password" placeholder="비밀번호 입력">
    <button class="button primary large" type="submit">관리자 로그인</button>
    <a class="auth-back" href="{{ url_for('web.dashboard') }}">← 현황 화면으로 돌아가기</a>
  </form>
</section>
{% endblock %}

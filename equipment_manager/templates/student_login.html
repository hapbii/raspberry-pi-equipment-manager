{% extends "base.html" %}
{% block title %}학생 로그인{% endblock %}
{% block content %}
<section class="auth-wrap"><form class="auth-card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <p class="eyebrow">STUDENT LOGIN</p><h1>학생 로그인</h1>
  <p>승인받은 계정으로 로그인하면 대여·반납과 본인 내역을 확인할 수 있습니다.</p>
  <label for="student-login-id">학번</label><input id="student-login-id" name="student_id" inputmode="numeric" maxlength="20" autocomplete="username" required>
  <label for="student-login-password">비밀번호</label><input id="student-login-password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
  <button class="button primary large" type="submit">로그인</button>
  <a class="auth-back" href="{{ url_for('web.student_register') }}">처음 이용하나요? 학생 회원가입</a>
  <a class="auth-back" href="{{ url_for('web.admin_login') }}">선생님·개발자 로그인</a>
  <p>승인 대기·학번 오류·비밀번호 분실은 선생님께 문의해 주세요.</p>
</form></section>
{% endblock %}
